<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Tic-Tac-Joe</title>
</head>

<body>
    <div class="wrapper">
        <div class="scores">
        <div class="player-one-score">Player One Score <span id="player-one-score"></span></div>
        <div class="result" id="result"></div>
        <div class="player-two-score">Player Two Score <span id="player-two-score"></span></div>
        </div>

        <div class="tic-tac-toe-grid"></div>
        <div class="restart">
            <button id ="restart-round-button">Restart Round</button>
            <button id ="restart-game-button">Restart Game</button>

        </div>
            
    </div>
    
</body>
</html>
